# Entity categories and how sensitive each one is on its own.
#
# "On its own" matters - the risk agent adjusts this using context. A LOW baseline here
# does not mean the entity is safe in every document.
#
# Owner: Nandha Jyothi E

categories:
  PERSON:          { sensitivity: high,     direct_identifier: true }
  NATIONAL_ID:     { sensitivity: critical, direct_identifier: true }
  ACCOUNT_NUMBER:  { sensitivity: critical, direct_identifier: true }
  EMAIL:           { sensitivity: high,     direct_identifier: true }
  PHONE:           { sensitivity: high,     direct_identifier: true }
  ADDRESS:         { sensitivity: high,     direct_identifier: true }
  DATE_OF_BIRTH:   { sensitivity: high,     direct_identifier: false }
  MEDICAL:         { sensitivity: critical, direct_identifier: false }

  # Quasi-identifiers. Individually weak, dangerous in combination - this is the
  # "assistant warden who joined in March 2024" case from the report.
  ROLE_TITLE:      { sensitivity: medium,   direct_identifier: false, quasi_identifier: true }
  AFFILIATION:     { sensitivity: medium,   direct_identifier: false, quasi_identifier: true }
  LOCATION:        { sensitivity: medium,   direct_identifier: false, quasi_identifier: true }
  DATE:            { sensitivity: low,      direct_identifier: false, quasi_identifier: true }
  ORGANIZATION:    { sensitivity: low,      direct_identifier: false, quasi_identifier: true }
  OTHER:           { sensitivity: low,      direct_identifier: false }
